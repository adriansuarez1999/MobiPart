{% extends 'layouts/post_layout.html' %}

{% block title %} Post {% endblock title %}


{% block content %}

    <h2>Resultado de la busqueda</h2>
    
    {% for post in posts %}
        <section class="">
            <p>{{ post.title }}</p>
            <p>{{ post.category }}</p>
            <p>{{ post.author }}</p> 
            <p>{{ post.content }}</p>
        </section>
    {% endfor %}
{% endblock content %}
